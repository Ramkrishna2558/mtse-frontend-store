<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-white dark:bg-stone-950 text-black dark:text-white docked full-width top-0 border-b border-stone-200 dark:border-stone-800 rounded-none z-50 sticky">
<div class="flex justify-between items-center w-full px-8 py-6 max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="hover:opacity-60 transition-opacity duration-300 flex items-center justify-center p-2">
<span class="material-symbols-outlined text-black dark:text-white">arrow_back</span>
</button>
</div>
<div class="font-serif text-lg tracking-widest text-black dark:text-white absolute left-1/2 -translate-x-1/2">
                PAYMENT
            </div>
<div class="flex items-center gap-4">
<button aria-label="shopping_bag" class="hover:opacity-60 transition-opacity duration-300 flex items-center justify-center p-2">
<span class="material-symbols-outlined text-black dark:text-white">shopping_bag</span>
</button>
</div>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile md:px-margin-desktop py-section-gap w-full max-w-container-max mx-auto">
<div class="w-full max-w-[600px] flex flex-col gap-12">
<div class="flex flex-col gap-4 text-center mb-8">
<h1 class="font-headline-md text-headline-md text-primary">Payment Method</h1>
<p class="font-body-md text-body-md text-secondary">Please select your preferred payment option.</p>
</div>
<!-- Payment Methods List -->
<div class="flex flex-col gap-4">
<!-- Card 1 (Selected) -->
<button class="w-full flex items-center justify-between p-6 bg-surface-container-lowest border border-primary relative cursor-pointer group transition-all duration-300">
<div class="flex items-center gap-6">
<div class="w-12 h-8 bg-surface-container flex items-center justify-center border border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider text-[10px]">VISA</span>
</div>
<div class="flex flex-col items-start">
<span class="font-body-md text-body-md text-primary">Visa ending in 4242</span>
<span class="font-label-caps text-label-caps text-secondary uppercase text-[10px] mt-1">Expires 12/25</span>
</div>
</div>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Card 2 -->
<button class="w-full flex items-center justify-between p-6 bg-surface-container-lowest border border-outline-variant hover:border-primary/30 relative cursor-pointer group transition-all duration-300">
<div class="flex items-center gap-6">
<div class="w-12 h-8 bg-surface-container flex items-center justify-center border border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider text-[10px]">MC</span>
</div>
<div class="flex flex-col items-start">
<span class="font-body-md text-body-md text-on-surface">Mastercard ending in 8888</span>
<span class="font-label-caps text-label-caps text-secondary uppercase text-[10px] mt-1">Expires 08/26</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary/30 transition-colors">radio_button_unchecked</span>
</button>
<!-- Card 3 -->
<button class="w-full flex items-center justify-between p-6 bg-surface-container-lowest border border-outline-variant hover:border-primary/30 relative cursor-pointer group transition-all duration-300">
<div class="flex items-center gap-6">
<div class="w-12 h-8 bg-surface-container flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-on-surface text-[18px]">account_balance_wallet</span>
</div>
<div class="flex flex-col items-start">
<span class="font-body-md text-body-md text-on-surface">Apple Pay</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary/30 transition-colors">radio_button_unchecked</span>
</button>
</div>
<!-- Add New Payment Method -->
<button class="flex items-center gap-2 self-start group mt-4">
<span class="material-symbols-outlined text-primary text-sm transition-transform group-hover:rotate-90 duration-300">add</span>
<span class="font-label-caps text-label-caps text-primary uppercase border-b border-transparent group-hover:border-primary transition-colors duration-300">Add New Payment Method</span>
</button>
<!-- Order Summary & Action -->
<div class="mt-12 flex flex-col gap-8 pt-8 border-t border-outline-variant/30">
<div class="flex justify-between items-end">
<span class="font-body-md text-body-md text-secondary">Total Amount</span>
<span class="font-headline-md text-headline-md text-primary">$1,250.00</span>
</div>
<button class="w-full bg-primary text-on-primary py-5 px-8 font-label-caps text-label-caps uppercase tracking-widest hover:bg-primary/90 transition-colors duration-300 flex justify-center items-center gap-4">
                    Confirm Payment
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
<!-- Decorative Image Elements (Hidden on very small screens to maintain focus) -->
<div class="hidden lg:block fixed right-0 top-1/2 -translate-y-1/2 translate-x-1/3 opacity-5 pointer-events-none w-96 h-96">
<img alt="A high-fashion, minimalist abstract composition with strong geometric shadows and bright white light. The texture is smooth and premium." class="w-full h-full object-cover mix-blend-multiply" data-alt="A high-fashion, minimalist abstract composition with strong geometric shadows and bright white light. The texture is smooth and premium, conveying quiet confidence and luxury." src="https://lh3.googleusercontent.com/aida/ADBb0ujKqh7wQW1OL-TcgAKA_eXR4k7cHtMiy-2vNBbcCxwvX5SkiBYuRgVooeFK6NBdbxzqYKJN9nZ06PuMuEWWvRrhPhYvzhEiQS3XQIYQW5PqBx4cVlazh9YyTtrSI-fhCIW4mQ8m3Oi-4pi-a2jVVoEUrEa6Yo3hQH-YrY8XCx1J7b6wZM8XeWUG-RwDYpXiyZ3d-H6Qhign4sCTcpa0gj8A9YcsEhK2iUgn48pgtf6nuBVp_LyidaNWcWzSLpTsVp4621_FGMkN"/>
</div>
</main>

<footer class="bg-stone-50 dark:bg-stone-900 rounded-none border-t border-stone-200 dark:border-stone-800 w-full py-12 px-8 flex flex-col items-center gap-8 mt-auto transition-all duration-300">
<div class="flex flex-col items-center gap-6">
<div class="font-serif text-sm tracking-widest text-black dark:text-white">PAYMENT</div>
<div class="flex gap-6">
<a class="text-stone-500 dark:text-stone-400 font-serif text-[10px] tracking-wider uppercase hover:underline decoration-1 underline-offset-4" href="#">Privacy Policy</a>
<a class="text-stone-500 dark:text-stone-400 font-serif text-[10px] tracking-wider uppercase hover:underline decoration-1 underline-offset-4" href="#">Terms of Service</a>
<a class="text-stone-500 dark:text-stone-400 font-serif text-[10px] tracking-wider uppercase hover:underline decoration-1 underline-offset-4" href="#">Contact</a>
</div>
<div class="text-stone-500 dark:text-stone-400 font-serif text-[10px] tracking-wider uppercase mt-4">

            </div>
</div>
</footer>
